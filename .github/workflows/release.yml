name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布为 Release 的标签（例如 v0.1.0）；留空只做构建验证'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm

      # 版本一致性：标签必须是 v + package.json version，避免发错版本。
      - name: Resolve version and tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
          else
            TAG="$INPUT_TAG"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ -n "$TAG" ] && [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match package.json version 'v$VERSION'"
            exit 1
          fi
          if [ -z "$TAG" ]; then
            echo "::notice::No tag provided; running build validation only."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # 桌面端 extractArchive 只剥离 "package/" 前缀，并要求 package.json 位于解压根目录，
      # 因此归档顶层目录必须命名为 package（与 npm pack 一致），不能用「包名-版本」目录。
      # 产物不含 node_modules；安装时勾选「准备依赖」由宿主执行 npm ci。
      - name: Package build output
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          STAGE="package"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -r dist "$STAGE/dist"
          cp package.json package-lock.json README.md "$STAGE/"
          if [ -f README.en.md ]; then cp README.en.md "$STAGE/"; fi
          if [ -f CHANGELOG.md ]; then cp CHANGELOG.md "$STAGE/"; fi
          BUNDLE="blc-plugin-publish-$VERSION.tgz"
          tar -czf "$BUNDLE" "$STAGE"
          sha256sum "$BUNDLE" > "$BUNDLE.sha256"
          echo "=== bundle ==="
          ls -lh "$BUNDLE" "$BUNDLE.sha256"
          echo "=== entries (must start with package/) ==="
          tar -tzf "$BUNDLE" | head -20

      - name: Upload validation artifact
        if: steps.meta.outputs.publish == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: blc-plugin-publish-${{ steps.meta.outputs.version }}
          path: |
            blc-plugin-publish-*.tgz
            blc-plugin-publish-*.tgz.sha256

      - name: Create or update GitHub Release
        if: steps.meta.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Release notes 取自 CHANGELOG 中对应版本的段落，末尾补提交对比链接。
          NOTES="release-notes.md"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > "$NOTES.raw"
          {
            cat "$NOTES.raw"
            echo
            echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/commits/$TAG"
          } > "$NOTES"
          echo "=== release notes ==="
          head -20 "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; updating assets and notes."
            gh release upload "$TAG" blc-plugin-publish-*.tgz blc-plugin-publish-*.tgz.sha256 --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            echo "Creating Release $TAG."
            gh release create "$TAG" \
              blc-plugin-publish-*.tgz blc-plugin-publish-*.tgz.sha256 \
              --title "blc-plugin-publish $TAG" \
              --notes-file "$NOTES"
          fi
          gh release view "$TAG" --json tagName,url,assets
